<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Dit personlige serieoverblik"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Mit Serieoverblik</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eef8;background:#0b1120}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#172554,#0f172a);padding:28px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid #334155}h1{margin:0;font-size:clamp(28px,5vw,40px)}header p{color:#a5b4fc;margin-bottom:0}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat,.panel,.item{background:#172033;border:1px solid #334155;border-radius:15px}.stat{padding:18px}.stat strong{display:block;font-size:28px}.stat span{color:#a9b5c8;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{background:#0d1728;border:1px solid #46536a;color:#fff;border-radius:10px;padding:12px;font:inherit;min-width:0}input[type=search]{flex:1;min-width:180px}button{background:#4f46e5;color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:#334155}button.danger{background:#9f1239}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.item{padding:17px;display:flex;flex-direction:column;gap:9px}.item h3{margin:0;font-size:17px}.pill{display:inline-block;background:#263d68;color:#c7d2fe;padding:5px 9px;border-radius:20px;font-size:12px;align-self:flex-start}.muted{color:#a9b5c8;font-size:13px}.item .actions{margin-top:auto;display:flex;gap:8px}.item .actions button{padding:8px 12px;font-size:13px}dialog{background:#172033;color:#fff;border:1px solid #64748b;border-radius:16px;width:min(94vw,480px)}dialog::backdrop{background:#000a}form{display:grid;gap:12px}label{display:grid;gap:5px;font-size:14px}textarea{min-height:90px;resize:vertical}footer{text-align:center;color:#94a3b8;padding:24px;font-size:12px}.hidden{display:none!important}@media(max-width:500px){.stat{padding:12px}.stat strong{font-size:23px}.toolbar>*{width:100%}}
</style></head><body><header><h1>📺 Mit Serieoverblik</h1><p>Alle dine serier samlet ét sted – også offline</p></header><main class="wrap"><section class="stats"><div class="stat"><strong id="total">–</strong><span>Serier</span></div><div class="stat"><strong id="seasons">–</strong><span>Sæsoner set</span></div><div class="stat"><strong id="genres">–</strong><span>Genrer</span></div></section><div class="toolbar"><input type="search" id="search" placeholder="Søg efter en serie…" aria-label="Søg"><select id="genre" aria-label="Vælg genre"><option value="">Alle genrer</option></select><select id="sort" aria-label="Sortering"><option value="title">A–Å</option><option value="seasons">Flest sæsoner</option></select></div><div class="toolbar"><button id="add">+ Tilføj serie</button><button class="secondary" id="export">Eksportér backup</button><button class="secondary" id="import">Importér backup</button><input class="hidden" type="file" id="file" accept="application/json,.json"></div><p id="count" class="muted" aria-live="polite"></p><section id="list" class="list"></section></main><footer>Gemmes lokalt på denne enhed. Brug eksport til sikkerhedskopi eller flytning til en anden enhed.</footer><dialog id="dlg"><form id="editor"><h2 id="dlgTitle">Serie</h2><input type="hidden" id="editId"><label>Seriens navn<input id="name" required maxlength="200"></label><label>Genre<input id="editGenre" list="genreSuggestions" required maxlength="100"></label><datalist id="genreSuggestions"></datalist><label>Sæsoner set<input type="number" id="editSeasons" min="0" step="1" required></label><label>Noter<textarea id="notes"></textarea></label><div class="toolbar"><button type="submit">Gem</button><button type="button" class="secondary" id="cancel">Annuller</button><button type="button" class="danger hidden" id="delete">Slet serie</button></div></form></dialog><script src="app.js" defer></script></body></html>
